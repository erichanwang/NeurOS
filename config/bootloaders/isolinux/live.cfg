label live-generic
	menu label ^Live (generic)
	menu default
	kernel /casper/vmlinuz
	append initrd=/casper/initrd.img boot=live config @LB_BOOTAPPEND_LIVE@

label live-generic-failsafe
	menu label ^Live (generic failsafe)
	kernel /casper/vmlinuz
	append initrd=/casper/initrd.img boot=live config @LB_BOOTAPPEND_LIVE@ @LB_BOOTAPPEND_FAILSAFE@
